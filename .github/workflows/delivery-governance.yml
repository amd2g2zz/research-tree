name: Delivery governance

on:
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Validate policy artifacts
        run: uv run --frozen python scripts/check_delivery_workflow.py validate

      - name: Validate OpenSpec execution governance
        run: uv run --frozen python scripts/check_openspec_governance.py

      - name: Verify generated package parity
        run: uv run --frozen python scripts/build_skill_packages.py --check

      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git diff --diff-filter=ACMR --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '*.py'
          | xargs -0r uv run --frozen ruff check

      - name: Check pull request delivery contract
        run: >-
          uv run --frozen python scripts/check_delivery_workflow.py check-pr
          --event "$GITHUB_EVENT_PATH"
