[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tree"
version = "0.1.0"
description = "Run-scoped foundation for research-grounded technical design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-tree = "research_tree.cli:main"
research-tree-setup = "research_tree.skill_setup:main"
research-tree-hook = "research_tree.lifecycle_hook:main"
research-tree-debug = "research_tree.debug_trace:main"
research-tree-migrate = "research_tree.migration_cli:main"

[dependency-groups]
test = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
