[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tree"
version = "0.1.0a2"
description = "Run-scoped foundation for research-grounded technical design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-tree = "research_tree.cli:main"
research-tree-setup = "research_tree.skill_setup:main"
research-tree-hook = "research_tree.lifecycle_hook:main"

[dependency-groups]
test = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "pydantic>=2.7,<3",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90", "PLR", "PLW", "ARG", "SIM", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# 存量豁免（engineering-baseline 收口，新代码零豁免；清偿排期见 ADR-007）
# PLR2004 magic-value-comparison：白名单校验模式天然逐字面比对（tree_state.py:144 先例），存量 218 处
"**" = ["PLR2004", "ARG", "SIM", "B", "PLR0913", "PLR0917", "PLR1704", "PLW", "PLR1714"]
# 语义化豁免（比 noqa 聚合更诚实）：PLR2004 白名单校验天然字面比对；ARG 协议签名/测试占位；
# SIM/B00x 属风格重构项，随触碰文件清偿；PLR0913/0917/1704/PLW 服务方法与 payload 解包宽签名，
# 拆分等价于 #333 的 coordinator 拆分（第二批）。清偿排期见 ADR-007。

[tool.ruff.lint.mccabe]
# 存量基线宽松起步：门挡新增，存量按豁免清偿（engineering-baseline PR 收口）
max-complexity = 40

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 40
max-statements = 150
max-returns = 20
max-positional-args = 10

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include the lifecycle matrix inside the installed wheel so coordinator can
# load it at import time. Without this, _load_lifecycle_transitions raises
# CoordinatorConfigError on a freshly installed environment (see issue #407).
# ADR-002 mandates a single canonical source for the lifecycle matrix.
"research_tree" = [
    "data/*.json",
]
