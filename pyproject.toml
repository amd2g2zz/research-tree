[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tree"
version = "0.1.0"
description = "Run-scoped foundation for research-grounded technical design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research-tree = "research_tree.cli:main"

[dependency-groups]
test = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
