services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
      args:
        RUNNER_BASE_IMAGE: "${EVALUATION_RUNNER_IMAGE:-python:3.12-slim@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    user: "65532:65532"
    working_dir: /workspace
    command: ["python", "-B", "-I", "-c", "import os; assert os.geteuid() != 0"]
    environment:
      HOME: /home/runner
      MODEL_BROKER_URL: http://evaluation-broker:8080
      ANTHROPIC_BASE_URL: http://evaluation-broker:8080/anthropic
      ANTHROPIC_API_KEY: broker-managed-placeholder
      SOURCE_BROKER_URL: http://source-broker:8081
      SYNTHETIC_USER_URL: http://user-simulator:8082
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/runner:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
    init: true
    restart: "no"
    networks:
      - runner-broker
      - source-broker
      - runner-simulator

  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
      args:
        BROKER_BASE_IMAGE: "${EVALUATION_BROKER_IMAGE:-python:3.12-slim@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    user: "65532:65532"
    environment:
      HOME: /nonexistent
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - source: deepseek_api_key
        target: deepseek_api_key
        mode: 0444
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    init: true
    restart: "no"
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=1).read()"
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 1s
    networks:
      runner-broker:
        aliases:
          - evaluation-broker
      broker-egress: {}
      simulator-model:
        aliases:
          - evaluation-broker

  source-broker:
    build:
      context: .
      dockerfile: Dockerfile.source-broker
      args:
        SOURCE_BROKER_BASE_IMAGE: "${EVALUATION_SOURCE_BROKER_IMAGE:-python:3.12-slim@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    user: "65532:65532"
    environment:
      HOME: /nonexistent
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    init: true
    restart: "no"
    expose:
      - "8081"
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/healthz', timeout=1).read()"
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 1s
    volumes:
      - source-captures:/var/lib/research-tree/source-captures
    networks:
      - source-broker
      - source-egress

  user-simulator:
    profiles: ["synthetic-user"]
    build:
      context: .
      dockerfile: Dockerfile.user-simulator
      args:
        USER_SIMULATOR_BASE_IMAGE: "${EVALUATION_USER_SIMULATOR_IMAGE:-python:3.12-slim@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    user: "65532:65532"
    environment:
      HOME: /nonexistent
    secrets:
      - source: synthetic_user_bundle
        target: synthetic_user_bundle
        mode: 0444
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    init: true
    restart: "no"
    expose:
      - "8082"
    healthcheck:
      test:
        - CMD
        - python
        - -B
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8082/healthz', timeout=1).read()"
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 1s
    networks:
      - runner-simulator
      - simulator-model

networks:
  runner-broker:
    internal: true
  broker-egress:
  source-broker:
    internal: true
  source-egress:
  runner-simulator:
    internal: true
  simulator-model:
    internal: true

volumes:
  source-captures:

secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_FILE:-/run/research-tree-no-secret-file}
  synthetic_user_bundle:
    file: ${SYNTHETIC_USER_BUNDLE_FILE:-/run/research-tree-no-synthetic-user-bundle}
